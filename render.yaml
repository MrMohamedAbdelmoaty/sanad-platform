# ============================================================
# Render Blueprint — منصة سند
# ضعه في جذر الريبو ثم: Render Dashboard → New → Blueprint
# سيُنشئ خدمة Web (Node) تلقائيًا مع متغيرات البيئة.
# ============================================================
services:
  - type: web
    name: sanad-platform
    runtime: node
    plan: free
    region: frankfurt          # أقرب منطقة لجمهور الخليج من خيارات Render الأوروبية
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # اختياري — عند ربط Supabase أزل التعليق واملأ القيم من لوحة Render
      # - key: NEXT_PUBLIC_SUPABASE_URL
      #   sync: false
      # - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
      #   sync: false
